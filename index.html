
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Protection Scanner</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  min-height: 100vh;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  color: #151515;
}

.container {
  max-width: 550px;
  margin: 0 auto;
}

.header {
  background: linear-gradient(120deg,#fff 45%,#ffda00);
  padding: 25px;
  border-radius: 22px;
  margin-bottom: 20px;
}

.logo {
  font-size: 20px;
  font-weight: 1000;
  margin-bottom: 24px;
}

h1 {
  font-size: 29px;
  line-height: 1;
  margin: 0;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.05);
}

.description {
  color: #777;
  line-height: 1.5;
  font-size: 14px;
  margin-bottom: 18px;
}

.camera-box {
  width: 100%;
  aspect-ratio: 4 / 5;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.scan-frame {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 35%;
  height: 30%;
  border: 3px solid #ffda00;
  border-radius: 12px;
  pointer-events: none;
}

.status {
  text-align: center;
  padding: 16px 5px;
  font-size: 14px;
  color: #777;
  line-height: 1.5;
}

button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 17px;
  background: #ffda00;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 14px;
}

button.dark {
  background: #222;
  color: white;
}

button:disabled {
  opacity: .5;
}

.error {
  background: #ffe7e7;
  color: #b00020;
  padding: 14px;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.5;
}

.success {
  background: #e5f8e9;
  color: #167532;
  padding: 14px;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #999;
  font-size: 11px;
  padding: 20px;
}

@media(max-width:380px) {
  .card { padding: 16px; }
  .header { padding: 20px; }
  h1 { font-size: 26px; }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">◆ MOBILE TREND</div>
    <h1>TREND<br>PROTECTION</h1>
  </div>

  <div class="card">

    <h2>Сканування товару</h2>

    <div class="description">
      Наведіть задню камеру смартфона на штрихкод товару Mobile Trend.
      Після зчитування автоматично повернемо вас до калькулятора.
    </div>

    <div class="camera-box">
      <video id="video" autoplay muted playsinline></video>
      <div class="scan-frame"></div>
    </div>

    <div class="status" id="status">
      Підготовка камери...
    </div>

    <div id="message"></div>

    <button id="startButton" onclick="startScanner()" hidden>
      УВІМКНУТИ КАМЕРУ
    </button>

    <button class="dark" onclick="goBack()">
      ПОВЕРНУТИСЯ ДО КАЛЬКУЛЯТОРА
    </button>

  </div>

  <div class="footer">
    MOBILE TREND © TREND PROTECTION
  </div>

</div>

<script>

let reader = null;
let controls = null;
let locked = false;
let starting = false;

const params = new URLSearchParams(location.search);
const returnUrl = params.get('return');


// АДРЕСА КАЛЬКУЛЯТОРА

function getReturnUrl() {

  if (!returnUrl) return null;

  try {

    const url = new URL(returnUrl);

    if (
      url.protocol !== 'https:' ||
      url.hostname !== 'script.google.com' ||
      !url.pathname.startsWith('/macros/s/') ||
      !url.pathname.endsWith('/exec')
    ) return null;

    return url.origin + url.pathname;

  } catch(e) {
    return null;
  }

}


// ПОВІДОМЛЕННЯ

function showError(text) {

  const el = document.getElementById('message');

  el.className = 'error';
  el.textContent = text;

}

function showSuccess(text) {

  const el = document.getElementById('message');

  el.className = 'success';
  el.textContent = text;

}


// ПОВЕРНЕННЯ

function goBack() {

  const url = getReturnUrl();

  if (url) {
    location.replace(url);
  } else {
    history.back();
  }

}


// ЗУПИНКА

function stopCamera() {

  if (controls) {
    controls.stop();
    controls = null;
  }

}


// ОБРОБКА ШТРИХКОДУ

function onCodeDetected(result) {

  if (locked || !result) return;

  const code = String(result.getText()).trim();

  if (!code) return;

  locked = true;

  document.getElementById('status').textContent =
    'Штрихкод успішно розпізнано!';

  showSuccess(
    'Зчитаний код: ' + code +
    '. Повертаємося до калькулятора...'
  );

  stopCamera();

  const url = getReturnUrl();

  if (!url) {

    showError('Не вдалося визначити адресу калькулятора.');

    locked = false;
    return;

  }

  const destination =
    url + '?barcode=' + encodeURIComponent(code);

  setTimeout(function() {
    location.replace(destination);
  }, 500);

}


// ЗАПУСК СКАНЕРА

async function startScanner() {

  if (starting || locked) return;

  starting = true;

  const button = document.getElementById('startButton');
  const status = document.getElementById('status');

  button.hidden = true;

  try {

    if (!window.isSecureContext ||
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        'Камера недоступна. Відкрийте сторінку через Safari або Chrome.'
      );

    }

    status.textContent = 'Завантаження системи розпізнавання...';

    // ЗАВАНТАЖЕННЯ ZXING

    const ZXing = await import(
      'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm'
    );

    reader = new ZXing.BrowserMultiFormatReader();

    status.textContent = 'Запуск задньої камери...';

    const video = document.getElementById('video');

    // ВИБІР ЗАДНЬОЇ КАМЕРИ ТА ПОСТІЙНЕ РОЗПІЗНАВАННЯ

    controls = await reader.decodeFromConstraints(

      {
        audio: false,

        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }

      },

      video,

      function(result, error, scanControls) {

        if (result) {
          onCodeDetected(result);
        }

      }

    );

    await video.play();

    status.textContent =
      'Камера активна. Наведіть її на штрихкод.';

    showSuccess(
      'Сканер готовий. Наведіть камеру на штрихкод і тримайте смартфон нерухомо.'
    );

  } catch(error) {

    console.error(error);

    stopCamera();

    status.textContent = 'Не вдалося запустити сканер.';

    let message = error.message || 'Невідома помилка.';

    if (error.name === 'NotAllowedError') {
      message = 'Дозвольте доступ до камери в налаштуваннях браузера.';
    }

    if (error.name === 'NotFoundError') {
      message = 'Задню камеру смартфона не знайдено.';
    }

    if (error.name === 'NotReadableError') {
      message = 'Камера використовується іншою програмою.';
    }

    showError(message);

    button.hidden = false;
    button.textContent = 'СПРОБУВАТИ ЩЕ РАЗ';

  } finally {

    starting = false;

  }

}


// ЗАКРИТТЯ СТОРІНКИ

window.addEventListener('pagehide', function() {
  stopCamera();
});


// АВТОЗАПУСК

window.addEventListener('load', function() {

  if (!getReturnUrl()) {

    showError(
      'Відкрийте сканер через кнопку в калькуляторі Trend Protection.'
    );

    document.getElementById('status').textContent =
      'Немає адреси повернення.';

    return;

  }

  startScanner();

});

</script>

</body>
</html>
